<svg xmlns="http://www.w3.org/2000/svg" width="680" height="72" viewBox="0 0 680 72" role="img" aria-label="Typing animation showing Software Engineer locations">
  <style>
    .line {
      fill: #7c3aed;
      font-family: "Fira Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 26px;
      font-weight: 600;
    }

    .cursor {
      fill: #7c3aed;
      animation: blink 0.9s steps(1) infinite;
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="clip-prefix">
      <rect x="20" y="12" width="0" height="40">
        <animate
          attributeName="width"
          dur="9s"
          repeatCount="indefinite"
          values="0;312;312;312;312;312;312;312;0"
          keyTimes="0;0.244;0.411;0.489;0.622;0.767;0.844;0.978;1" />
      </rect>
    </clipPath>

    <clipPath id="clip-waterloo">
      <rect x="332" y="12" width="0" height="40">
        <animate
          attributeName="width"
          dur="9s"
          repeatCount="indefinite"
          values="0;0;187;187;0;0;0;0;0"
          keyTimes="0;0.244;0.411;0.489;0.622;0.767;0.844;0.978;1" />
      </rect>
    </clipPath>

    <clipPath id="clip-toronto">
      <rect x="332" y="12" width="0" height="40">
        <animate
          attributeName="width"
          dur="9s"
          repeatCount="indefinite"
          values="0;0;0;0;0;171;171;0;0"
          keyTimes="0;0.244;0.411;0.489;0.622;0.767;0.844;0.978;1" />
      </rect>
    </clipPath>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <text x="20" y="43" class="line" clip-path="url(#clip-prefix)">Software Engineer - </text>
  <text x="332" y="43" class="line" clip-path="url(#clip-waterloo)">Waterloo, ON</text>
  <text x="332" y="43" class="line" clip-path="url(#clip-toronto)">Toronto, ON</text>

  <rect x="20" y="18" width="3" height="30" rx="1.5" class="cursor">
    <animate
      attributeName="x"
      dur="9s"
      repeatCount="indefinite"
      values="20;332;332;519;519;332;503;503;332;20"
      keyTimes="0;0.244;0.322;0.411;0.489;0.622;0.767;0.844;0.978;1" />
  </rect>
</svg>
