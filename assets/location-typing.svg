<svg xmlns="http://www.w3.org/2000/svg" width="720" height="72" viewBox="0 0 720 72" role="img" aria-label="Typing animation showing Software Engineer locations">
  <style>
    .line {
      fill: #60a5fa;
      font-family: "Fira Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 25px;
      font-weight: 600;
    }

    .cursor {
      fill: #38bdf8;
      animation: blink 0.9s steps(1) infinite;
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="clip-prefix">
      <rect x="24" y="12" width="0" height="40">
        <animate
          attributeName="width"
          id="prefixType"
          from="0"
          to="304"
          dur="2.1s"
          begin="0s"
          fill="freeze" />
      </rect>
    </clipPath>

    <clipPath id="clip-waterloo">
      <rect x="344" y="12" width="0" height="40">
        <animate
          attributeName="width"
          id="waterlooType"
          from="0"
          to="202"
          dur="1.6s"
          begin="prefixType.end+0.2s;torontoDelete.end+0.4s"
          fill="freeze" />
        <animate
          attributeName="width"
          id="waterlooDelete"
          from="202"
          to="0"
          dur="0.9s"
          begin="waterlooType.end+0.9s"
          fill="freeze" />
      </rect>
    </clipPath>

    <clipPath id="clip-toronto">
      <rect x="344" y="12" width="0" height="40">
        <animate
          attributeName="width"
          id="torontoType"
          from="0"
          to="184"
          dur="1.4s"
          begin="waterlooDelete.end+0.3s"
          fill="freeze" />
        <animate
          attributeName="width"
          id="torontoDelete"
          from="184"
          to="0"
          dur="0.8s"
          begin="torontoType.end+0.9s"
          fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <rect width="100%" height="100%" fill="transparent" />

  <text x="24" y="43" class="line" textLength="304" lengthAdjust="spacingAndGlyphs" clip-path="url(#clip-prefix)">Software Engineer -</text>
  <text x="344" y="43" class="line" textLength="202" lengthAdjust="spacingAndGlyphs" clip-path="url(#clip-waterloo)">Waterloo, ON</text>
  <text x="344" y="43" class="line" textLength="184" lengthAdjust="spacingAndGlyphs" clip-path="url(#clip-toronto)">Toronto, ON</text>

  <rect x="24" y="17" width="3" height="30" rx="1.5" class="cursor">
    <animate
      attributeName="x"
      from="24"
      to="344"
      dur="2.1s"
      begin="0s"
      fill="freeze" />
    <animate
      attributeName="x"
      from="344"
      to="546"
      dur="1.6s"
      begin="waterlooType.begin"
      fill="freeze" />
    <animate
      attributeName="x"
      from="546"
      to="344"
      dur="0.9s"
      begin="waterlooDelete.begin"
      fill="freeze" />
    <animate
      attributeName="x"
      from="344"
      to="528"
      dur="1.4s"
      begin="torontoType.begin"
      fill="freeze" />
    <animate
      attributeName="x"
      from="528"
      to="344"
      dur="0.8s"
      begin="torontoDelete.begin"
      fill="freeze" />
  </rect>
</svg>
